{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check your inbox - PLAYON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'playon/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'users/css/register.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'playon/favicon.ico' %}">
</head>
<body>

<div class="auth-page">

  <div class="auth-left">
    <a href="{% url 'index' %}" class="auth-logo">Play<span>On</span></a>
    <div class="auth-left-center">
      <h1 class="auth-left-title">
        <span class="fill-red">CHECK</span><br>
        <span class="outline">INBOX</span>
      </h1>
      <p class="auth-left-desc">
        We've sent a reset link to your email if an account exists for it.
      </p>
    </div>
    <div class="auth-bg-text" aria-hidden="true">PO</div>
  </div>

  <div class="auth-right">

    <div class="auth-mobile-header">
      <a href="{% url 'index' %}" class="auth-mobile-logo">Play<span>On</span></a>
      <a href="{% url 'index' %}" class="auth-mobile-back">Home</a>
    </div>

    <div class="auth-form-wrap active">
      <div class="auth-form-title">Check your inbox</div>
      <p class="auth-form-sub" style="display:block;margin-bottom:24px;">
        If an account exists for that email, a reset link is on its way. It may take a few minutes to arrive.
      </p>
      <a href="{% url 'login' %}" class="auth-submit" style="display:block;text-align:center;text-decoration:none;">Back to sign in →</a>
    </div>

  </div>

</div>

</body>
</html>

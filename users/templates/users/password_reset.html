{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password - PLAYON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'playon/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'users/css/register.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'playon/favicon.ico' %}">
</head>
<body>

<div class="auth-page">

  <div class="auth-left">
    <a href="{% url 'index' %}" class="auth-logo">Play<span>On</span></a>
    <div class="auth-left-center">
      <h1 class="auth-left-title">
        <span class="fill-red">RESET</span><br>
        <span class="outline">PASSWORD</span>
      </h1>
      <p class="auth-left-desc">
        Enter the email you signed up with and we'll send you a link to set a new password.
      </p>
    </div>
    <div class="auth-bg-text" aria-hidden="true">PO</div>
  </div>

  <div class="auth-right">

    <div class="auth-mobile-header">
      <a href="{% url 'index' %}" class="auth-mobile-logo">Play<span>On</span></a>
      <a href="{% url 'index' %}" class="auth-mobile-back">Home</a>
    </div>

    <form class="auth-form-wrap active" method="post">
      {% csrf_token %}
      <div class="auth-form-title">Forgot password?</div>
      <div class="auth-form-sub">
        Remembered it?
        <a href="{% url 'login' %}" style="color:var(--red);font-family:'Barlow Condensed',sans-serif;font-size:.82rem;letter-spacing:.04em;font-weight:700;text-decoration:underline;text-underline-offset:2px;">Sign in →</a>
      </div>

      <div class="field">
        <label for="id_email" class="required">Email</label>
        <div class="field-wrap">
          <input type="email" name="email" id="id_email" placeholder="example@gmail.com" autocomplete="email" required>
          <span class="field-ico">✉</span>
        </div>
      </div>

      <button type="submit" class="auth-submit">Send reset link →</button>

    </form>

  </div>

</div>

</body>
</html>
